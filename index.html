<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <script>
      // Téléphone (pointeur grossier + côté court < 600 px) → page d'accueil légère /m, avant tout
      // chargement du jeu. Tablettes et PC gardent le jeu. ?desktop=1 force le jeu (retenu pour
      // l'onglet ; avec here=1, retenu sur l'appareil) ; ?debug n'est jamais redirigé. Même règle que isPhone() dans src/landing/logic.ts.
      ;(function () {
        var q = location.search
        var keep = false
        try {
          if (/[?&]desktop=1(&|$)/.test(q)) sessionStorage.setItem('ombres.desktop', '1')
          // « Ouvrir le jeu ici quand même » (page /m) : ce téléphone ou cette tablette sert d'écran,
          // choix retenu sur l'appareil (revenir à l'accueil : ouvrir /m).
          if (/[?&]here=1(&|$)/.test(q)) localStorage.setItem('ombres.desktop', '1')
          keep = sessionStorage.getItem('ombres.desktop') === '1' || localStorage.getItem('ombres.desktop') === '1'
        } catch (e) {
          keep = /[?&]desktop=1(&|$)/.test(q)
        }
        if (keep || /[?&]debug/.test(q)) return
        try {
          if (Math.min(screen.width, screen.height) < 600 && matchMedia('(pointer: coarse)').matches) location.replace('/m' + q + location.hash)
        } catch (e) {}
      })()
    </script>
